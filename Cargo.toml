[workspace]
members = [
  "crates/flowmation-application",
  "crates/flowmation-cli",
  "crates/flowmation-domain",
  "crates/flowmation-ollama",
  "crates/flowmation-sqlite",
  "crates/flowmation-test-support",
  "crates/flowmation-workflow-host",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "ISC"
rust-version = "1.96"

[workspace.dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive"] }
cron = "0.15.0"
futures = "0.3.31"
hex = "0.4.3"
http = "1.3.1"
iana-time-zone = "0.1.64"
nix = { version = "0.30.1", features = ["fs", "signal", "term"] }
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.38.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.17"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
