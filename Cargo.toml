[workspace]
members = [
  "crates/flowmation-application",
  "crates/flowmation-cli",
  "crates/flowmation-domain",
  "crates/flowmation-codex",
  "crates/flowmation-ollama",
  "crates/flowmation-sqlite",
  "crates/flowmation-test-support",
  "crates/flowmation-workflow-host",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "ISC"
rust-version = "1.96"

[workspace.dependencies]
async-trait = "0.1.91"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
cron = "0.15.0"
crossterm = "0.29.0"
dunce = "1.0.5"
futures = "0.3.33"
hex = "0.4.3"
http = "1.5.0"
iana-time-zone = "0.1.65"
nix = { version = "0.30.1", features = ["fs", "signal", "term"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.38.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
